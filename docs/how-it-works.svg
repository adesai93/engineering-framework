<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8e9ec"/>
    </marker>
  </defs>
  <rect width="1200" height="800" rx="12" fill="#191c22"/>

  <!-- header -->
  <text x="600" y="48" text-anchor="middle" fill="#e8e9ec" font-size="28" font-weight="700">How my engineering agent team works</text>
  <text x="600" y="76" text-anchor="middle" fill="#a3a8b3" font-size="13">I'm the engineer. A lead agent runs a small team of specialists. The rules travel with me; each client's memory stays with that client.</text>

  <!-- row 1: Me / Lead / Team members -->
  <rect x="30" y="100" width="300" height="165" rx="10" fill="#5a470f" stroke="#e2b83f" stroke-width="2"/>
  <text x="180" y="132" text-anchor="middle" fill="#fff6d8" font-size="20" font-weight="700">Me</text>
  <text x="180" y="152" text-anchor="middle" fill="#fff6d8" font-size="12" opacity=".8">engineer · decision maker</text>
  <text x="180" y="180" text-anchor="middle" fill="#fff6d8" font-size="13">say what I'm working on, make the calls,</text>
  <text x="180" y="198" text-anchor="middle" fill="#fff6d8" font-size="13">confirm risky actions, approve what ships</text>
  <text x="180" y="240" text-anchor="middle" fill="#fff6d8" font-size="11.5" font-family="Consolas, Menlo, monospace" opacity=".85">just talk · no commands to learn</text>

  <line x1="336" y1="168" x2="424" y2="168" stroke="#e8e9ec" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="380" y="146" text-anchor="middle" fill="#a3a8b3" font-size="11">tasks, answers,</text>
  <text x="380" y="159" text-anchor="middle" fill="#a3a8b3" font-size="11">corrections</text>
  <line x1="424" y1="206" x2="336" y2="206" stroke="#e8e9ec" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="380" y="224" text-anchor="middle" fill="#a3a8b3" font-size="11">recap, options,</text>
  <text x="380" y="237" text-anchor="middle" fill="#a3a8b3" font-size="11">drafts to approve</text>

  <rect x="430" y="100" width="340" height="165" rx="10" fill="#142f6b" stroke="#5b8cff" stroke-width="2"/>
  <text x="600" y="132" text-anchor="middle" fill="#e6eeff" font-size="20" font-weight="700">Lead</text>
  <text x="600" y="152" text-anchor="middle" fill="#e6eeff" font-size="12" opacity=".8">the agent I talk to · Claude Code, Copilot or Cursor</text>
  <text x="600" y="180" text-anchor="middle" fill="#e6eeff" font-size="13">reloads the client's memory, routes work,</text>
  <text x="600" y="198" text-anchor="middle" fill="#e6eeff" font-size="13">keeps the log, does the bookkeeping</text>
  <text x="600" y="240" text-anchor="middle" fill="#e6eeff" font-size="11.5" font-family="Consolas, Menlo, monospace" opacity=".85">never grades its own work</text>

  <line x1="776" y1="168" x2="864" y2="168" stroke="#e8e9ec" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="820" y="146" text-anchor="middle" fill="#a3a8b3" font-size="11">brief: facts, files,</text>
  <text x="820" y="159" text-anchor="middle" fill="#a3a8b3" font-size="11">how it's judged</text>
  <line x1="864" y1="206" x2="776" y2="206" stroke="#e8e9ec" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="820" y="224" text-anchor="middle" fill="#a3a8b3" font-size="11">results · security</text>
  <text x="820" y="237" text-anchor="middle" fill="#a3a8b3" font-size="11">findings (advisory)</text>

  <rect x="870" y="100" width="300" height="165" rx="10" fill="#1b4d26" stroke="#57c46b" stroke-width="2"/>
  <text x="1020" y="132" text-anchor="middle" fill="#e5f8e9" font-size="20" font-weight="700">Team members</text>
  <text x="1020" y="152" text-anchor="middle" fill="#e5f8e9" font-size="12" opacity=".8">specialist agents</text>
  <text x="1020" y="178" text-anchor="middle" fill="#e5f8e9" font-size="13">architect — research, design, ADRs</text>
  <text x="1020" y="196" text-anchor="middle" fill="#e5f8e9" font-size="13">engineer — build, fix, deploy, verify</text>
  <text x="1020" y="214" text-anchor="middle" fill="#e5f8e9" font-size="13">security — review, flags findings</text>
  <text x="1020" y="232" text-anchor="middle" fill="#e5f8e9" font-size="13">retro — improves the team itself</text>
  <text x="1020" y="254" text-anchor="middle" fill="#e5f8e9" font-size="11.5" font-family="Consolas, Menlo, monospace" opacity=".85">reviewer is read-only</text>

  <!-- memory band -->
  <line x1="600" y1="266" x2="600" y2="298" stroke="#e8e9ec" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="612" y="287" fill="#a3a8b3" font-size="11">reads first, writes last</text>
  <rect x="110" y="302" width="980" height="118" rx="10" fill="none" stroke="#3a3f4a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="600" y="326" text-anchor="middle" fill="#f0729b" font-size="12.5" font-weight="700" letter-spacing="1.5">EACH CLIENT WORKSPACE IS THE MEMORY</text>
  <g font-size="11" text-anchor="middle">
    <rect x="135" y="340" width="145" height="64" rx="7" fill="#262a32" stroke="#3a3f4a"/>
    <text x="207" y="361" fill="#e8e9ec" font-weight="700" font-size="12">context.md</text>
    <text x="207" y="377" fill="#a3a8b3">stack · access</text>
    <text x="207" y="391" fill="#a3a8b3">conventions · people</text>
    <rect x="292" y="340" width="145" height="64" rx="7" fill="#262a32" stroke="#3a3f4a"/>
    <text x="364" y="361" fill="#e8e9ec" font-weight="700" font-size="12">rules.md</text>
    <text x="364" y="377" fill="#a3a8b3">corrections + decisions</text>
    <text x="364" y="391" fill="#a3a8b3">read every chat</text>
    <rect x="449" y="340" width="145" height="64" rx="7" fill="#262a32" stroke="#3a3f4a"/>
    <text x="521" y="361" fill="#e8e9ec" font-weight="700" font-size="12">NOW.md</text>
    <text x="521" y="377" fill="#a3a8b3">active work</text>
    <text x="521" y="391" fill="#a3a8b3">one page</text>
    <rect x="606" y="340" width="145" height="64" rx="7" fill="#262a32" stroke="#3a3f4a"/>
    <text x="678" y="361" fill="#e8e9ec" font-weight="700" font-size="12">projects/</text>
    <text x="678" y="377" fill="#a3a8b3">brief · next · log</text>
    <text x="678" y="391" fill="#a3a8b3">decisions</text>
    <rect x="763" y="340" width="145" height="64" rx="7" fill="#262a32" stroke="#3a3f4a"/>
    <text x="835" y="361" fill="#e8e9ec" font-weight="700" font-size="12">inventory.md</text>
    <text x="835" y="377" fill="#a3a8b3">built from what</text>
    <text x="835" y="391" fill="#a3a8b3">I paste</text>
    <rect x="920" y="340" width="145" height="64" rx="7" fill="#5a470f" stroke="#e2b83f"/>
    <text x="992" y="361" fill="#fff6d8" font-weight="700" font-size="12">feedback.md</text>
    <text x="992" y="377" fill="#fff6d8" opacity=".85">what to improve</text>
    <text x="992" y="391" fill="#fff6d8" opacity=".85">weekly retro</text>
  </g>

  <!-- loop -->
  <text x="600" y="458" text-anchor="middle" fill="#f0729b" font-size="12.5" font-weight="700" letter-spacing="1.5">THE LOOP: EVERY TASK</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="51" y="472" width="118" height="48" rx="7" fill="#5a470f" stroke="#e2b83f" stroke-width="1.5"/>
    <text x="110" y="492" fill="#fff6d8">I say what</text><text x="110" y="507" fill="#fff6d8">I'm working on</text>
    <rect x="191" y="472" width="118" height="48" rx="7" fill="#142f6b" stroke="#5b8cff" stroke-width="1.5"/>
    <text x="250" y="492" fill="#e6eeff">Lead reloads</text><text x="250" y="507" fill="#e6eeff">memory</text>
    <rect x="331" y="472" width="118" height="48" rx="7" fill="#3c1f6e" stroke="#a77bf0" stroke-width="1.5"/>
    <text x="390" y="492" fill="#f1e9ff">Architect:</text><text x="390" y="507" fill="#f1e9ff">options</text>
    <rect x="471" y="472" width="118" height="48" rx="7" fill="#5a470f" stroke="#e2b83f" stroke-width="1.5"/>
    <text x="530" y="492" fill="#fff6d8">I decide</text><text x="530" y="507" fill="#fff6d8">(saved)</text>
    <rect x="611" y="472" width="118" height="48" rx="7" fill="#1b4d26" stroke="#57c46b" stroke-width="1.5"/>
    <text x="670" y="492" fill="#e5f8e9">Engineer:</text><text x="670" y="507" fill="#e5f8e9">build + verify</text>
    <rect x="751" y="472" width="118" height="48" rx="7" fill="#4a1f2a" stroke="#f26d6d" stroke-width="1.5"/>
    <text x="810" y="492" fill="#ffe3e3">Security:</text><text x="810" y="507" fill="#ffe3e3">flags findings</text>
    <rect x="891" y="472" width="118" height="48" rx="7" fill="#142f6b" stroke="#5b8cff" stroke-width="1.5"/>
    <text x="950" y="492" fill="#e6eeff">Document</text><text x="950" y="507" fill="#e6eeff">change-record</text>
    <rect x="1031" y="472" width="118" height="48" rx="7" fill="#5a470f" stroke="#e2b83f" stroke-width="1.5"/>
    <text x="1090" y="492" fill="#fff6d8">Park</text><text x="1090" y="507" fill="#fff6d8">next step saved</text>
  </g>
  <g stroke="#e8e9ec" stroke-width="1.5">
    <line x1="170" y1="496" x2="189" y2="496" marker-end="url(#a)"/>
    <line x1="310" y1="496" x2="329" y2="496" marker-end="url(#a)"/>
    <line x1="450" y1="496" x2="469" y2="496" marker-end="url(#a)"/>
    <line x1="590" y1="496" x2="609" y2="496" marker-end="url(#a)"/>
    <line x1="730" y1="496" x2="749" y2="496" marker-end="url(#a)"/>
    <line x1="870" y1="496" x2="889" y2="496" marker-end="url(#a)"/>
    <line x1="1010" y1="496" x2="1029" y2="496" marker-end="url(#a)"/>
    <polyline points="1090,521 1090,540 110,540 110,523" fill="none" marker-end="url(#a)"/>
  </g>
  <text x="600" y="558" text-anchor="middle" fill="#a3a8b3" font-size="11.5">corrections become rules · fires switch to pair mode · quick questions skip the loop · security advises, I decide · client scanners do the blocking</text>

  <!-- rules travel / memory stays -->
  <text x="600" y="598" text-anchor="middle" fill="#f0729b" font-size="12.5" font-weight="700" letter-spacing="1.5">RULES TRAVEL · MEMORY STAYS WITH THE CLIENT</text>
  <rect x="30" y="612" width="380" height="128" rx="10" fill="#3c1f6e" stroke="#a77bf0" stroke-width="2"/>
  <text x="220" y="642" text-anchor="middle" fill="#f1e9ff" font-size="17" font-weight="700">Rulebook</text>
  <text x="220" y="661" text-anchor="middle" fill="#f1e9ff" font-size="12" opacity=".8">this repo · git · no client data</text>
  <text x="220" y="686" text-anchor="middle" fill="#f1e9ff" font-size="13">agents · guardrails · standards · playbooks</text>
  <text x="220" y="704" text-anchor="middle" fill="#f1e9ff" font-size="13">lenses · templates · CI check</text>
  <text x="220" y="726" text-anchor="middle" fill="#f1e9ff" font-size="11.5" font-family="Consolas, Menlo, monospace" opacity=".85">generates Claude Code, Copilot + Cursor files</text>

  <line x1="416" y1="652" x2="784" y2="652" stroke="#e8e9ec" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="600" y="642" text-anchor="middle" fill="#a3a8b3" font-size="11">new version → workspace update (my notes untouched)</text>
  <line x1="784" y1="700" x2="416" y2="700" stroke="#e8e9ec" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="600" y="718" text-anchor="middle" fill="#a3a8b3" font-size="11">weekly retro report: client-free, leak-checked</text>
  <text x="600" y="732" text-anchor="middle" fill="#a3a8b3" font-size="11">I review it, then approve the changes</text>

  <rect x="790" y="612" width="380" height="128" rx="10" fill="#1d2129" stroke="#a77bf0" stroke-width="2"/>
  <text x="980" y="642" text-anchor="middle" fill="#e8e9ec" font-size="17" font-weight="700">Client workspaces</text>
  <text x="980" y="661" text-anchor="middle" fill="#a3a8b3" font-size="12">local · own git · one per chat, never mixed</text>
  <rect x="808" y="676" width="344" height="24" rx="5" fill="#262a32" stroke="#3a3f4a"/>
  <text x="980" y="693" text-anchor="middle" fill="#e8e9ec" font-size="12">Client A — Azure · ADO · Copilot</text>
  <rect x="808" y="706" width="344" height="24" rx="5" fill="#262a32" stroke="#3a3f4a"/>
  <text x="980" y="723" text-anchor="middle" fill="#e8e9ec" font-size="12">Client B — multi-cloud · Terraform · Claude Code</text>

  <text x="600" y="778" text-anchor="middle" fill="#737985" font-size="11.5">v0.2.0 · tested 2026-10-03 across 18 scenario runs: firefights, landing zone, runners, APIM, KQL, VPN, PoC, doc updates, retro (leak scan clean)</text>
</svg>
